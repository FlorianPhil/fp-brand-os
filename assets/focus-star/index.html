<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Focus Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --acc: #5A5CF9;
    --acc-soft: rgba(90,92,249,.07);
    --border: #E5E7EB;
    --muted: #8888A0;
    --ink: #1A1A2E;
    --ff-h: 'Bricolage Grotesque', system-ui, sans-serif;
    --ff-b: 'Poppins', system-ui, sans-serif;
    --ease: cubic-bezier(.16,1,.3,1);
    --bg: #FFFFFF;
    --bg-dial: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--ff-b); color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; overscroll-behavior: none; }

  /* ── LAYOUT ── (embedded variant: fixed-height container) */
  .stage {
    position: relative; width: 100%; height: 100vh; height: 100svh;
    display: grid;
    grid-template-columns: minmax(620px, 60%) 1fr;
    align-items: start;
    overflow: hidden;
  }
  .stage::after {
    content: ''; position: absolute;
    top: 0; bottom: 0; left: 60%;
    width: 1px; background: var(--border);
    pointer-events: none; z-index: 3;
    opacity: var(--divider-opacity, 0);
    transition: opacity .5s;
  }

  /* ── LEFT PANEL ── */
  .reader {
    position: relative; z-index: 2;
    min-width: 0;
    padding: clamp(38px,4vw,64px) clamp(40px,3.6vw,68px) clamp(32px,3.2vw,52px) clamp(48px,4.5vw,86px);
    display: flex; flex-direction: column;
    background: var(--bg);
    height: 100%;
    overflow: hidden;
  }
  .reader-fit {
    width: 100%;
  }
  .detail-fit {
    width: 100%;
    transform-origin: top left;
    will-change: transform;
  }

  .stage[data-mode="case"] {
    grid-template-columns: minmax(700px, 62%) 1fr;
  }

  .stage[data-mode="case"] .reader {
    padding-top: clamp(34px,3.4vw,54px);
    padding-bottom: clamp(28px,2.8vw,44px);
  }

  .stage[data-mode="case"] .navigation-panel {
    margin-bottom: clamp(22px,2.4vw,34px);
  }

  /* mode bar */
  .mode-bar {
    display: flex; align-items: center; gap: 16px;
    min-height: 42px;
    margin-bottom: 14px;
  }

  .case-logo {
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transition: opacity .35s var(--ease);
    visibility: hidden; pointer-events: none;
    flex-shrink: 0;
  }
  .case-logo.visible { opacity: 1; visibility: visible; pointer-events: auto; }
  .case-logo .logo-lockup {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg);
  }
  .case-logo .logo-text {
    display: flex; flex-direction: column; line-height: 1.15;
  }
  .case-logo .logo-name {
    font-family: var(--ff-h); font-weight: 800; font-size: 12px;
    text-transform: uppercase; letter-spacing: .04em; color: var(--ink);
  }

  .mode-toggle {
    display: flex;
    background: #F0F0F5;
    border-radius: 100px; padding: 4px; gap: 2px;
  }
  .mode-btn {
    font-family: var(--ff-b); font-size: 11px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    border: none; cursor: pointer;
    padding: 7px 18px; border-radius: 100px;
    color: var(--muted);
    transition: color .2s var(--ease), background .2s var(--ease), box-shadow .2s;
    line-height: 1; white-space: nowrap;
    background: transparent;
  }
  .mode-btn.active {
    background: var(--bg);
    color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }

  .navigation-panel {
    min-width: 0;
    display: grid;
    gap: 14px;
    margin-bottom: clamp(26px,3.4vw,44px);
  }
  .pillar-nav {
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .pillar-link {
    min-width: 0;
    display: grid;
    gap: 6px;
    padding: 11px 10px 12px;
    border-right: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
  }
  .pillar-link:last-child { border-right: 0; }
  .pillar-link:hover,
  .pillar-link:focus-visible {
    color: var(--ink);
    background: #FAFAFC;
    outline: none;
  }
  .pillar-link.active {
    color: var(--ink);
    background: var(--acc-soft);
    box-shadow: inset 0 -2px 0 var(--acc);
  }
  .pillar-link .nav-index {
    font-family: var(--ff-b);
    font-size: 9px;
    font-weight: 700;
    color: var(--acc);
    line-height: 1;
  }
  .pillar-link .nav-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--ff-h);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1;
  }
  .step-controls {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .arrow-btn {
    width: 38px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    font-family: var(--ff-b);
    font-size: 15px;
    font-weight: 600;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .arrow-btn:hover,
  .arrow-btn:focus-visible {
    border-color: var(--acc);
    color: var(--acc);
    outline: none;
  }
  .section-count {
    flex: 1;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
    font-family: var(--ff-b);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  /* hero */
  .hero { min-width: 0; flex: 0 0 auto; display: flex; flex-direction: column; justify-content: flex-start; }

  .pillar-eyebrow {
    font-family: var(--ff-h); font-size: clamp(12px,1.1vw,14px); font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--acc); margin-bottom: 12px;
    display: flex; align-items: center; gap: 16px;
  }
  .pillar-eyebrow::before {
    content: ''; display: block;
    width: 28px; height: 10px;
    border-top: 2px solid var(--acc);
    border-left: 2px solid var(--acc);
    background: transparent; flex-shrink: 0;
    align-self: flex-end;
    transform: translateY(1px);
  }

  .pillar-title {
    font-family: var(--ff-h); font-weight: 800;
    font-size: clamp(52px, 6vw, 88px);
    line-height: .9; letter-spacing: -.03em;
    text-transform: uppercase; color: var(--ink);
    margin: 0 0 28px;
  }
  .pillar-title .dot { color: var(--acc); }

  .stage[data-mode="case"] .pillar-eyebrow {
    margin-bottom: 8px;
  }

  .stage[data-mode="case"] .pillar-title {
    font-size: clamp(46px, 4.6vw, 70px);
    line-height: .92;
    letter-spacing: -.02em;
    margin-bottom: 16px;
  }

  .pillar-desc {
    font-family: var(--ff-b); font-weight: 400;
    font-size: clamp(15px,1vw,17px);
    line-height: 1.62; color: var(--muted);
    margin: 0 0 28px; max-width: 720px;
  }
  .pillar-desc strong { font-weight: 600; color: var(--ink); }

  .stage[data-mode="case"] .pillar-desc {
    font-size: clamp(16px,1.04vw,18px);
    line-height: 1.56;
    color: #6E6E86;
    max-width: 860px;
    margin-bottom: 20px;
  }

  /* persona image placeholder */
  .persona-block { display: none; margin-bottom: 20px; }
  .persona-block.visible { display: flex; gap: 20px; align-items: flex-start; }
  .persona-image {
    width: 118px; height: 142px; flex-shrink: 0;
    background: #F0F0F5; border: 1px solid var(--border);
    border-radius: 0;
    display: block;
    overflow: hidden; position: relative;
  }
  .persona-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .persona-silhouette { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .persona-silhouette svg { width: 68px; height: auto; }
  .persona-img-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,.08);
    font-family: var(--ff-b); font-size: 8px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); text-align: center; padding: 4px 0;
  }
  .persona-info { flex: 1; padding-top: 4px; }

  .stage[data-mode="case"] .persona-block.visible {
    display: grid;
    grid-template-columns: minmax(150px, 184px) minmax(0, 1fr);
    gap: 22px;
    align-items: stretch;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
    margin-bottom: 18px;
  }

  .stage[data-mode="case"] .persona-image {
    width: 100%;
    height: auto;
    min-height: 184px;
    aspect-ratio: 4 / 5;
    background: #F7F7FA;
  }

  .stage[data-mode="case"] .persona-img-label {
    display: none;
  }

  .stage[data-mode="case"] .persona-info {
    display: grid;
    align-content: center;
    gap: 10px;
    padding-top: 0;
  }

  .persona-role {
    font-family: var(--ff-h); font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: .04em; color: var(--ink);
    line-height: 1.2; margin-bottom: 6px;
  }
  .persona-context {
    font-family: var(--ff-b); font-size: 13px; font-weight: 400;
    color: var(--muted); line-height: 1.5; margin-bottom: 8px;
  }
  .persona-need {
    font-family: var(--ff-b); font-size: 13px; font-weight: 600;
    color: var(--acc); line-height: 1.4;
    border-top: 1px solid var(--border); padding-top: 8px;
  }

  .stage[data-mode="case"] .persona-role {
    font-size: clamp(17px,1.2vw,22px);
    margin-bottom: 0;
  }

  .stage[data-mode="case"] .persona-context {
    max-width: 720px;
    font-family: var(--ff-h);
    font-size: clamp(24px,2.05vw,36px);
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -.015em;
    color: var(--ink);
    margin-bottom: 0;
  }

  .stage[data-mode="case"] .persona-need {
    max-width: 780px;
    border-top: 0;
    padding-top: 0;
    font-size: clamp(15px,1vw,17px);
    line-height: 1.5;
  }

  .persona-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .persona-tags span {
    border: 1px solid var(--border);
    padding: 4px 7px;
    font-family: var(--ff-b);
    font-size: 10px;
    line-height: 1;
    color: var(--muted);
    background: var(--bg);
  }

  /* archetype */
  .archetype-block { display: none; margin-bottom: 20px; }
  .archetype-block.visible { display: grid; grid-template-columns: minmax(140px, 190px) 1fr; gap: 18px; align-items: start; }
  .archetype-icons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }
  .archetype-img {
    aspect-ratio: 1;
    background: #F7F7FA; border: 1px solid var(--border); border-radius: 0;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .archetype-img img { width: 88%; height: 88%; object-fit: contain; display: block; }
  .archetype-img .arch-icon { font-size: 24px; line-height: 1; color: var(--acc); }
  .arch-name {
    font-family: var(--ff-h); font-weight: 800; font-size: 20px;
    text-transform: uppercase; letter-spacing: -.01em; color: var(--ink);
    line-height: 1; margin-bottom: 4px;
  }
  .arch-type {
    font-family: var(--ff-b); font-size: 10px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--acc); margin-bottom: 8px;
  }
  .arch-traits { display: flex; flex-wrap: wrap; gap: 4px; }
  .arch-tag {
    font-family: var(--ff-b); font-size: 10px; font-weight: 500;
    color: var(--muted); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 100px; line-height: 1;
  }

  .stage[data-mode="case"] .archetype-block.visible {
    grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
    gap: 22px;
    align-items: center;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
    margin-bottom: 16px;
  }

  .stage[data-mode="case"] .archetype-icons {
    gap: 10px;
  }

  .stage[data-mode="case"] .archetype-img {
    background: #FAFAFC;
  }

  .stage[data-mode="case"] .archetype-img img {
    width: 92%;
    height: 92%;
  }

  .stage[data-mode="case"] .arch-name {
    font-size: clamp(30px,2.5vw,46px);
    line-height: .9;
    margin-bottom: 8px;
  }

  .stage[data-mode="case"] .arch-type {
    font-size: 11px;
    margin-bottom: 12px;
  }

  .stage[data-mode="case"] .arch-tag {
    display: block;
    font-size: 12px;
    line-height: 1.25;
    padding: 5px 8px;
    border-radius: 0;
  }

  .stage[data-mode="case"] .arch-traits {
    display: grid;
    gap: 6px;
    max-width: 760px;
  }

  .insight-grid {
    display: none;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .insight-grid.visible { display: grid; }
  .insight-card {
    min-width: 0;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 12px 12px 14px;
  }
  .insight-card .label {
    font-family: var(--ff-b); font-size: 8px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--acc);
    margin-bottom: 6px;
  }
  .insight-card p {
    margin: 0;
    font-family: var(--ff-b);
    font-size: 11px;
    line-height: 1.45;
    color: var(--ink);
  }

  .stage[data-mode="case"] .insight-grid {
    gap: 10px;
    border: 0;
    margin-bottom: 16px;
  }

  .stage[data-mode="case"] .insight-card {
    border: 1px solid var(--border);
    background: #FAFAFC;
    padding: 15px 16px 17px;
    min-height: 118px;
  }

  .stage[data-mode="case"] .insight-card .label {
    font-size: 9px;
    margin-bottom: 8px;
  }

  .stage[data-mode="case"] .insight-card p {
    font-size: clamp(13px,.92vw,15px);
    line-height: 1.5;
  }
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  .tag-row span {
    border: 1px solid var(--border);
    padding: 3px 6px;
    font-family: var(--ff-b);
    font-size: 9px;
    line-height: 1;
    color: var(--muted);
  }
  .moodboard-block {
    display: none;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    margin-bottom: 20px;
  }
  .moodboard-block.visible { display: grid; }
  .moodboard-item {
    aspect-ratio: 1.15;
    border: 1px solid var(--border);
    overflow: hidden;
    background: #F7F7FA;
  }
  .moodboard-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .stage[data-mode="case"] .moodboard-block {
    gap: 10px;
    margin-bottom: 16px;
  }

  .stage[data-mode="case"] .moodboard-item {
    aspect-ratio: 1.45;
  }

  /* apply block */
  .apply-block {
    border-left: 2px solid var(--border); padding-left: 16px;
    margin-bottom: 20px; display: none;
  }
  .apply-block.visible { display: block; }
  .apply-label {
    font-family: var(--ff-b); font-size: 9px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .apply-text {
    font-family: var(--ff-b); font-size: 13px; line-height: 1.62;
    color: var(--ink); font-weight: 400;
  }

  .stage[data-mode="case"] .apply-block.visible {
    border-left-color: var(--acc);
    margin-bottom: 16px;
  }

  .stage[data-mode="case"] .apply-text {
    font-size: clamp(13px,.92vw,15px);
    line-height: 1.55;
  }

  /* impacts */
  .impacts-block { border-top: 1px solid var(--border); }
  .stage[data-mode="case"] .impacts-block { display: none; }
  .impacts-head {
    font-family: var(--ff-b); font-size: 9px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
    padding: 12px 0 8px;
  }
  .impacts {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: 1fr 1fr;
  }
  .impacts li {
    display: flex; align-items: center;
    padding: 8px 10px 8px 0; border-top: 1px solid var(--border);
    font-family: var(--ff-b); font-weight: 500;
    font-size: clamp(12px,.82vw,14px); color: var(--ink);
  }
  .impacts li:nth-child(even) { padding-left: 12px; border-left: 1px solid var(--border); }
  .impacts li::before { content: '—'; color: var(--acc); margin-right: 7px; font-size: 9px; }

  /* ── DIAL ── (embedded variant: relative + fixed height) */
  .dial-wrap {
    position: relative;
    height: 100%; overflow: hidden;
    background: var(--bg-dial);
    cursor: grab;
  }
  .dial-wrap.dragging { cursor: grabbing; }
  .dial-wrap > svg { position: absolute; inset: 6%; width: 88%; height: 88%; }

  .indicator {
    position: absolute; top: 5%; left: 50%;
    transform: translateX(-50%);
    z-index: 5; pointer-events: none;
    display: block; line-height: 0;
  }
  .indicator svg { display: block; }
  .indicator .ix-line { stroke: var(--acc); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .indicator .ix-tip { fill: var(--acc); }

  /* SVG */
  .star-arm { transition: fill .6s var(--ease); }
  .star-arm.active { fill: var(--acc); }
  .star-outline { fill: none; stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .ring-tick { stroke: rgba(80,80,100,.32); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ring-tick.major { stroke: rgba(50,50,70,.6); }
  .ring-tick.pillar { stroke: rgba(26,26,46,.55); stroke-width: 1.4; }
  .ring-tick.pillar.active { stroke: var(--acc); stroke-width: 2; }
  .pillar-text {
    font-family: var(--ff-h); font-weight: 700;
    font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
    fill: rgba(136,136,160,.6);
    transition: fill .6s var(--ease), font-size .5s var(--ease);
  }
  .pillar-text.active { fill: var(--ink); }
  .center-cap { fill: var(--bg); stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .center-spoke { stroke: var(--acc); stroke-width: 2; stroke-linecap: square; vector-effect: non-scaling-stroke; }

  @media (max-width: 980px) {
    .stage,
    .stage[data-mode="case"] {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) clamp(104px, 16svh, 180px);
      width: 100vw;
      max-width: 100vw;
      overflow: hidden;
    }
    .stage::after { display: none; }
    .reader {
      height: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 26px clamp(20px,5vw,44px) 20px;
    }
    .reader-fit,
    .detail-fit {
      min-width: 0;
      max-width: 100%;
    }
    .navigation-panel { margin-bottom: 26px; }
    .dial-wrap {
      height: 100%;
      min-height: 0;
    }
    .dial-wrap > svg { inset: 0; width: 100%; height: 100%; }
    .stage[data-mode="case"] .reader {
      padding: 26px clamp(20px,5vw,44px) 20px;
    }
  }

  @media (max-width: 640px) {
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    .stage,
    .stage[data-mode="case"] {
      grid-template-rows: minmax(0, 1fr) clamp(82px, 12svh, 118px);
      width: 100vw;
      max-width: 100vw;
      overflow: hidden;
    }
    .stage,
    .reader,
    .navigation-panel,
    .hero,
    .pillar-desc,
    .impacts-block {
      width: 100%;
      max-width: 100%;
    }
    .mode-bar {
      align-items: flex-start;
      flex-direction: column;
      min-height: 74px;
      gap: 8px;
    }

<script>
/* fixed defaults ... no edit panel in standalone build */
window.springK = 0.036;
window.springDamp = 0.82;
window.WHEEL_THRESHOLD = 100;
window.scrollLean = 27;
window.scrollLeanBuildup = 300;
window.__activeLabelSize = 38;
</script>

<script src="./config.js"></script>
<script>
/* ============================================================ DATA */
const CONFIG_PATH = './config.json';
let SOURCE_DATA = null;
let BRAND = { name: 'Brand', shortName: 'Brand' };
let PILLARS = [];

function normalizePanel(panel={}){
  return {
    desc: panel.desc || '',
    apply: panel.apply || '',
    impacts: Array.isArray(panel.impacts) ? panel.impacts : [],
    persona: panel.persona || null,
    archetype: panel.archetype || null,
    archetypeAssets: panel.archetypeAssets || null,
    moodboard: Array.isArray(panel.moodboard) ? panel.moodboard : [],
    details: panel.details || null
  };
}

function escapeHTML(value=''){
  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function truncate(value='', max=150){
  const clean = String(value).trim();
  return clean.length > max ? `${clean.slice(0, max - 1).trim()}...` : clean;
}

function resolveAssetPath(path=''){
  const value = String(path);
  return value.startsWith('assets/') ? `../${value.slice('assets/'.length)}` : value;
}

function normalizeConfig(config){
  if(!config || !Array.isArray(config.pillars) || !config.pillars.length){
    throw new Error('config.json is missing pillars');
  }
  return {
    ...config,
    brand: config.brand || {},
    visual: config.visual || {},
    pillars: config.pillars.map((pillar,index)=>({
      ...pillar,
      id: pillar.id || `p${index+1}`,
      title: pillar.title || `P${index+1}`,
      eyebrow: pillar.eyebrow || '',
      guide: normalizePanel(pillar.guide),
      case: normalizePanel(pillar.case)
    }))
  };
}

function applyTheme(config){
  const root = document.documentElement;
  const brand = config.brand || {};
  const visual = config.visual || {};
  if(brand.accentColor) root.style.setProperty('--acc', brand.accentColor);
  if(brand.inkColor) root.style.setProperty('--ink', brand.inkColor);
  if(visual.background) root.style.setProperty('--bg', visual.background);
  if(visual.dialBackground) root.style.setProperty('--bg-dial', visual.dialBackground);
  document.getElementById('case-brand-name').textContent = brand.name || brand.shortName || 'Brand';
  document.title = `${brand.shortName || brand.name || 'Brand'} Focus Star`;
}

/* ============================================================ GEOMETRY */
const STEP = 72;
const STAR_R = 278, STAR_INNER = STAR_R * 0.38;
const RING_INNER = 338, RING_TICK_R = 360, PILLAR_TEXT_R = 480;

/* ============================================================ STATE */
let mode = 'guide';
let activeIdx = 0;
let rotation = 0, target = 0;
let dragging = false, lastPointerAng = 0, dragVelocity = 0, lastDragTime = 0;
let wheelAccum = 0; // for scroll resistance

const stage      = document.getElementById('stage');
const dialWrap   = document.getElementById('dialWrap');
const rotor      = document.getElementById('rotor');
const fineTicks  = document.getElementById('fineTicks');
const pillarRing = document.getElementById('pillarRing');
const starGroup  = document.getElementById('starGroup');
const reader     = document.querySelector('.reader');
const readerFit  = document.getElementById('reader-fit');
const detailFit  = document.getElementById('detail-fit');
const pillarNav  = document.getElementById('pillar-nav');

function buildSectionNav(){
  pillarNav.innerHTML = PILLARS.map((p,i)=>`
    <a class="pillar-link${i===activeIdx?' active':''}" href="#${p.id}" data-pidx="${i}">
      <span class="nav-index">${String(i+1).padStart(2,'0')}</span>
      <span class="nav-label">${p.title}</span>
    </a>
  `).join('');
  pillarNav.querySelectorAll('.pillar-link').forEach(link=>{
    link.addEventListener('click',event=>{
      event.preventDefault();
      goToIndex(+link.dataset.pidx);
    });
  });
}

/* ============================================================ BUILD DIAL */
function buildFineTicks(){
  fineTicks.innerHTML = '';
  const f=document.createDocumentFragment();
  for(let a=0;a<360;a+=6){
    const major=(a%18===0);
    const rad=(a-90)*Math.PI/180;
    const x1=Math.cos(rad)*RING_INNER, y1=Math.sin(rad)*RING_INNER;
    const r2=major?RING_TICK_R:RING_INNER+8;
    const x2=Math.cos(rad)*r2, y2=Math.sin(rad)*r2;
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1.toFixed(2)); ln.setAttribute('y1',y1.toFixed(2));
    ln.setAttribute('x2',x2.toFixed(2)); ln.setAttribute('y2',y2.toFixed(2));
    ln.setAttribute('class','ring-tick'+(major?' major':''));
    f.appendChild(ln);
  }
  fineTicks.appendChild(f);
}

function buildPillarRing(){
  pillarRing.innerHTML = '';
  const f=document.createDocumentFragment();
  PILLARS.forEach((p,i)=>{
    const ang=i*STEP, rad=(ang-90)*Math.PI/180;
    const x1=Math.cos(rad)*(RING_TICK_R+4), y1=Math.sin(rad)*(RING_TICK_R+4);
    const x2=Math.cos(rad)*(RING_TICK_R+24), y2=Math.sin(rad)*(RING_TICK_R+24);
    const tk=document.createElementNS('http://www.w3.org/2000/svg','line');
    tk.setAttribute('x1',x1.toFixed(2)); tk.setAttribute('y1',y1.toFixed(2));
    tk.setAttribute('x2',x2.toFixed(2)); tk.setAttribute('y2',y2.toFixed(2));
    tk.setAttribute('class','ring-tick pillar'); tk.dataset.pidx=i;
    f.appendChild(tk);

    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','pillar-label-g'); g.dataset.ang=ang;
    g.setAttribute('transform',`rotate(${ang}) translate(0 ${-PILLAR_TEXT_R}) rotate(${-ang})`);
    g.style.cursor='pointer';
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','pillar-text');
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','central');
    t.dataset.pidx=i;
    t.textContent=p.title.toUpperCase();
    g.appendChild(t);
    g.addEventListener('click', e=>{ e.stopPropagation(); goToIndex(i); });
    f.appendChild(g);
  });
  pillarRing.appendChild(f);
}

function buildStar(){
  starGroup.innerHTML = '';
  function pt(a,r){ const rad=(a-90)*Math.PI/180; return{x:Math.cos(rad)*r,y:Math.sin(rad)*r}; }
  const f=document.createDocumentFragment();
  PILLARS.forEach((p,i)=>{
    const tip=pt(i*STEP,STAR_R), lv=pt(i*STEP-36,STAR_INNER), rv=pt(i*STEP+36,STAR_INNER);
    const arm=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arm.setAttribute('points',`0,0 ${lv.x.toFixed(2)},${lv.y.toFixed(2)} ${tip.x.toFixed(2)},${tip.y.toFixed(2)} ${rv.x.toFixed(2)},${rv.y.toFixed(2)}`);
    arm.setAttribute('class','star-arm'); arm.setAttribute('fill','transparent'); arm.dataset.pidx=i;
    arm.style.cursor='pointer';
    arm.addEventListener('click', e=>{ e.stopPropagation(); goToIndex(i); });
    f.appendChild(arm);
  });
  const out=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  function p2(a,r){ const rad=(a-90)*Math.PI/180; return `${(Math.cos(rad)*r).toFixed(2)},${(Math.sin(rad)*r).toFixed(2)}`; }
  let pts=[];
  for(let i=0;i<5;i++){ pts.push(p2(i*STEP,STAR_R)); pts.push(p2(i*STEP+36,STAR_INNER)); }
  out.setAttribute('points',pts.join(' ')); out.setAttribute('class','star-outline');
  f.appendChild(out);
  starGroup.appendChild(f);
}

/* ============================================================ INTERACTION */
function clientAngle(e){
  const r=dialWrap.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI;
}
dialWrap.addEventListener('pointerdown',e=>{
  dragging=true; dialWrap.classList.add('dragging');
  dialWrap.setPointerCapture(e.pointerId);
  lastPointerAng=clientAngle(e); lastDragTime=performance.now(); dragVelocity=0;
});
dialWrap.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const ang=clientAngle(e);
  let d=ang-lastPointerAng;
  if(d>180)d-=360; if(d<-180)d+=360;
  rotation+=d; target+=d;
  const now=performance.now();
  dragVelocity=d/Math.max(1,now-lastDragTime);
  lastDragTime=now; lastPointerAng=ang;
  applyRotation(); liveHighlight();
});
function endDrag(){
  if(!dragging) return;
  dragging=false; dialWrap.classList.remove('dragging');
  // small momentum nudge, then snap
  const nudge=dragVelocity*40;
  goToIndex(nearestIdx(rotation+nudge));
}
dialWrap.addEventListener('pointerup',endDrag);
dialWrap.addEventListener('pointercancel',endDrag);

/* Scroll with resistance — accumulate delta, snap when crossing threshold */
/* Scroll resistance threshold — controlled by tweaks */
let WHEEL_THRESHOLD = 20;
let leanOffset = 0; // visual lean during scroll build-up

let leanResetTimer = null;
let snapLockedUntil = 0;
function handleWheel(e){
  e.preventDefault();
  // ignore wheel events for 400ms after a snap (kills trackpad inertia chaining)
  if (performance.now() < snapLockedUntil) return;

  const threshold = window.WHEEL_THRESHOLD || WHEEL_THRESHOLD;
  const lean = (window.scrollLean !== undefined ? window.scrollLean : 0);
  const buildup = window.scrollLeanBuildup || threshold;
  const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if(delta === 0) return;
  wheelAccum += delta;
  if(lean > 0){
    const progress = Math.min(Math.abs(wheelAccum) / buildup, 1);
    leanOffset = -Math.sign(wheelAccum) * Math.pow(progress, 1.5) * lean;
  } else {
    leanOffset = 0;
  }
  if(Math.abs(wheelAccum) >= threshold){
    // hold the leaned position briefly so the user sees the recoil at full amplitude
    const dir = delta > 0 ? 1 : -1;
    snapLockedUntil = performance.now() + 400;
    setTimeout(() => {
      leanOffset = 0;
      wheelAccum = 0;
      goToIndex((activeIdx + dir + PILLARS.length) % PILLARS.length);
    }, 110);
  }
  // release: when scroll stops short of threshold, reset accumulator and clear lean
  clearTimeout(leanResetTimer);
  leanResetTimer = setTimeout(() => {
    wheelAccum = 0;
    leanOffset = 0;
  }, 180);
}
stage.addEventListener('wheel',handleWheel,{passive:false});

/* Arrow keys: LEFT = next (clockwise), RIGHT = prev — reversed per request */
window.addEventListener('keydown',e=>{
  if(!PILLARS.length) return;
  if(e.key==='ArrowLeft') goToIndex((activeIdx+1)%PILLARS.length);
  if(e.key==='ArrowRight') goToIndex((activeIdx-1+PILLARS.length)%PILLARS.length);
  if(e.key==='Escape') goToIndex(0);
  if(e.key>='1'&&e.key<=String(PILLARS.length)) goToIndex(+e.key-1);
});

/* ============================================================ LOGIC */
function nearestIdx(rot){
  let best=0, bestD=Infinity;
  for(let i=0;i<PILLARS.length;i++){
    const want=-i*STEP;
    // compare modulo — find shortest arc
    let d = ((rot - want) % 360 + 540) % 360 - 180;
    if(Math.abs(d)<bestD){bestD=Math.abs(d);best=i;}
  }
  return best;
}

function angDelta(a,b){ let d=(a-b)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; }

function liveHighlight(){ highlightDial(nearestIdx(rotation)); }

/* Infinite rotation: search ±10 full revolutions, pick closest to current rotation */
function goToIndex(i){
  if(!PILLARS.length || !Number.isFinite(i)) return;
  i = (i + PILLARS.length) % PILLARS.length;
  const want = -i * STEP;
  let best = want, bestD = Infinity;
  for(let k = -10; k <= 10; k++){
    const c = want + k * 360;
    const d = Math.abs(rotation - c);
    if(d < bestD){ bestD = d; best = c; }
  }
  target = best;
  activeIdx = i;
  if(PILLARS[i] && window.location.hash !== `#${PILLARS[i].id}`){
    history.replaceState(null, '', `#${PILLARS[i].id}`);
  }
  setActivePillar(i);
}

/* spring params — controlled by tweaks */
let springK = 0.055;
let springDamp = 0.93; // higher = less bounce
let velocity = 0;
function tick(){
  if(!dragging){
    const force = (target - rotation) * (window.springK || springK);
    velocity = (velocity + force) * (window.springDamp || springDamp);
    rotation += velocity;
    if(Math.abs(target - rotation) < 0.02 && Math.abs(velocity) < 0.02){
      rotation = target; velocity = 0;
    }
    applyRotation();
  }
  requestAnimationFrame(tick);
}

function applyRotation(){
  const display = rotation + leanOffset;
  rotor.setAttribute('transform',`rotate(${display.toFixed(3)})`);
  document.querySelectorAll('.pillar-label-g').forEach(g=>{
    const ang=+g.dataset.ang;
    g.setAttribute('transform',`rotate(${ang}) translate(0 ${-PILLAR_TEXT_R}) rotate(${-ang-display})`);
  });
}

/* ============================================================ RENDER */
function setActivePillar(i, options={}){
  window.__activeIdx = i;
  const p=PILLARS[i];
  if(!p) return;
  const data=mode==='case' ? p.case : p.guide;
  stage.dataset.mode = mode;
  stage.dataset.pillar = p.id;

  document.getElementById('p-eyebrow').textContent=p.eyebrow.toUpperCase();
  document.getElementById('p-title').textContent=p.title;
  document.getElementById('p-desc').innerHTML=data.desc || '';

  // persona
  const pb=document.getElementById('persona-block');
  const insightGrid=document.getElementById('insight-grid');
  const moodboardBlock=document.getElementById('moodboard-block');
  const personaTags=document.getElementById('persona-tags');
  insightGrid.classList.remove('visible');
  insightGrid.innerHTML='';
  moodboardBlock.classList.remove('visible');
  moodboardBlock.innerHTML='';
  personaTags.innerHTML='';

  if(mode==='case'&&p.id==='people'&&p.case.persona){
    const pe=p.case.persona;
    document.getElementById('persona-role').textContent=pe.role;
    document.getElementById('persona-context').textContent=pe.quote || pe.tagline || pe.context;
    document.getElementById('persona-need').textContent=pe.need;
    const personaImg=document.getElementById('persona-img');
    const personaFallback=document.getElementById('persona-fallback');
    if(pe.image && pe.image.path){
      personaImg.src=resolveAssetPath(pe.image.path);
      personaImg.alt=pe.image.alt || pe.role || 'Persona avatar';
      personaImg.style.display='block';
      personaFallback.style.display='none';
      personaImg.onerror=()=>{
        personaImg.style.display='none';
        personaFallback.style.display='flex';
      };
    } else {
      personaImg.removeAttribute('src');
      personaImg.style.display='none';
      personaFallback.style.display='flex';
    }
    const insightCards = [
      ['Motivation', pe.rationalMotivation],
      ['Pain', pe.painPoint],
      ['Trigger', pe.decisionTrigger || (pe.buyingCriteria || []).slice(0,3).join(', ')],
    ].filter(card=>card[1]);
    insightGrid.innerHTML = insightCards.map(([label,value])=>`
      <article class="insight-card">
        <div class="label">${escapeHTML(label)}</div>
        <p>${escapeHTML(truncate(value, 230))}</p>
      </article>
    `).join('');
    if(pe.tags && pe.tags.length){
      personaTags.innerHTML = pe.tags.slice(0,6).map(tag=>`<span>${escapeHTML(tag)}</span>`).join('');
    }
    insightGrid.classList.add('visible');
    pb.classList.add('visible');
  } else { pb.classList.remove('visible'); }

  // archetype
  const ab=document.getElementById('archetype-block');
  if(mode==='case'&&p.id==='personality'&&p.case.archetype){
    const a=p.case.archetype;
    const primary=a.primary || {};
    const secondary=(a.secondary || []).filter(item=>item && item.name);
    const assets=p.case.archetypeAssets || {};
    const iconItems=[
      assets.primary || null,
      ...((assets.secondary || []).filter(Boolean))
    ].filter(Boolean);
    document.getElementById('archetype-icons').innerHTML=iconItems.map(item=>`
      <div class="archetype-img">
        ${item.icon ? `<img src="${escapeHTML(resolveAssetPath(item.icon))}" alt="${escapeHTML(item.alt || item.name || 'Archetype')}">` : '<div class="arch-icon">*</div>'}
      </div>
    `).join('');
    document.getElementById('arch-name').textContent=primary.name || 'Archetype';
    document.getElementById('arch-type').textContent=[
      primary.weight ? `Primary ${Math.round(primary.weight*100)}%` : 'Primary',
      secondary.length ? `Secondary ${secondary.map(item=>item.name).join(' + ')}` : ''
    ].filter(Boolean).join(' · ');
    const traitItems=[
      primary.essence,
      ...secondary.map(item=>item.essence)
    ].filter(Boolean);
    document.getElementById('arch-traits').innerHTML=traitItems.map(tr=>`<span class="arch-tag">${escapeHTML(truncate(tr, 70))}</span>`).join('');
    const details=p.case.details || {};
    const insightCards=[
      ['Tone', 'Warm but not soft. Sharp but not mean. Playful but not empty.'],
      ['Signature', (details['Voice is'] || []).slice(0,4).join(', ')],
      ['Not', (details['Voice is not'] || []).slice(0,4).join(', ')],
    ].filter(card=>card[1]);
    insightGrid.innerHTML = insightCards.map(([label,value])=>`
      <article class="insight-card">
        <div class="label">${escapeHTML(label)}</div>
        <p>${escapeHTML(truncate(value, 150))}</p>
      </article>
    `).join('');
    insightGrid.classList.add('visible');
    if(data.moodboard && data.moodboard.length){
      moodboardBlock.innerHTML=data.moodboard.slice(0,4).map(item=>`
        <div class="moodboard-item"><img src="${escapeHTML(resolveAssetPath(item.path))}" alt="${escapeHTML(item.alt || item.role || 'Moodboard reference')}"></div>
      `).join('');
      moodboardBlock.classList.add('visible');
    }
    ab.classList.add('visible');
  } else { ab.classList.remove('visible'); }

  if(mode==='case' && !insightGrid.classList.contains('visible') && data.details){
    const detailCards = Object.entries(data.details)
      .filter(([,value])=>Array.isArray(value) ? value.length : value)
      .slice(0,3)
      .map(([label,value])=>[
        label,
        Array.isArray(value) ? value.join(' · ') : value
      ]);
    if(detailCards.length){
      insightGrid.innerHTML = detailCards.map(([label,value])=>`
        <article class="insight-card">
          <div class="label">${escapeHTML(label)}</div>
          <p>${escapeHTML(truncate(value, 260))}</p>
        </article>
      `).join('');
      insightGrid.classList.add('visible');
    }
  }

  // apply
  const apb=document.getElementById('apply-block');
  if(mode==='case'&&data.apply){
    const applyLabel = document.querySelector('#apply-block .apply-label');
    if(applyLabel) {
      applyLabel.textContent = p.id === 'people' ? 'Audience fit' : p.id === 'personality' ? 'Operating rule' : 'How to use';
    }
    document.getElementById('apply-text').textContent=data.apply;
    apb.classList.add('visible');
  } else { apb.classList.remove('visible'); }

  document.getElementById('impacts-head').textContent='What it shapes';
  document.getElementById('p-impacts').innerHTML=(mode==='guide' ? (data.impacts || []) : []).map(it=>`<li>${it}</li>`).join('');

  highlightDial(i);
  updateSectionNav(i);
  if(!options.skipFit) requestAnimationFrame(fitReader);
}

function highlightDial(i){
  window.__activeIdx = i;
  document.querySelectorAll('.star-arm').forEach(a=>a.classList.toggle('active',+a.dataset.pidx===i));
  document.querySelectorAll('.ring-tick.pillar').forEach(a=>a.classList.toggle('active',+a.dataset.pidx===i));
  const activeSize = window.__activeLabelSize || 26;
  document.querySelectorAll('.pillar-text').forEach(a=>{
    const on=+a.dataset.pidx===i;
    a.classList.toggle('active',on);
    a.style.fontSize=(on?activeSize:14)+'px';
  });
}

function updateSectionNav(i){
  document.querySelectorAll('.pillar-link').forEach(link=>{
    const on=+link.dataset.pidx===i;
    link.classList.toggle('active',on);
    if(on) link.setAttribute('aria-current','true');
    else link.removeAttribute('aria-current');
  });
  const count=document.getElementById('section-count');
  if(count) count.textContent=`${String(i+1).padStart(2,'0')} / ${String(PILLARS.length).padStart(2,'0')}`;
}

let fittingReader = false;
function fitReader(){
  if(fittingReader || !reader || !readerFit || !detailFit) return;
  fittingReader = true;

  detailFit.style.transform = 'scale(1)';
  detailFit.style.width = '100%';

  if(window.innerWidth <= 980){
    reader.dataset.fitScale = 'scroll';
    fittingReader = false;
    return;
  }

  const styles = getComputedStyle(reader);
  const availableHeight = reader.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom);
  const availableForDetails = availableHeight - detailFit.offsetTop;
  const needed = Math.max(1, detailFit.scrollHeight);
  let scale = availableForDetails / needed;

  const minScale = window.innerWidth >= 1180 ? 0.8 : window.innerWidth >= 900 ? 0.7 : 0.01;
  scale = Math.max(minScale, Math.min(1, scale));
  detailFit.style.transform = `scale(${scale})`;
  detailFit.style.width = `${100 / scale}%`;
  reader.dataset.fitScale = scale.toFixed(3);

  fittingReader = false;
}

function setMode(m){
  mode=m;
  stage.dataset.mode = m;
  document.getElementById('btn-guide').classList.toggle('active',m==='guide');
  document.getElementById('btn-case').classList.toggle('active',m==='case');
  const logo=document.getElementById('case-logo');
  if(m==='case'){ logo.classList.add('visible'); }
  else { logo.classList.remove('visible'); }
  setActivePillar(activeIdx);
}

async function init(){
  try {
    let rawConfig = window.FOCUS_STAR_CONFIG || null;
    if(!rawConfig){
      const response = await fetch(CONFIG_PATH, { cache: 'no-store' });
      if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      rawConfig = await response.json();
    }
    SOURCE_DATA = normalizeConfig(rawConfig);
    BRAND = SOURCE_DATA.brand;
    PILLARS = SOURCE_DATA.pillars;
    applyTheme(SOURCE_DATA);
    buildSectionNav();
    buildFineTicks();
    buildPillarRing();
    buildStar();

    const initialMode = new URLSearchParams(window.location.search).get('mode');
    if(initialMode === 'case' || initialMode === 'guide') mode = initialMode;
    const initialIdx = PILLARS.findIndex(p=>`#${p.id}`===window.location.hash);
    goToIndex(initialIdx >= 0 ? initialIdx : 0);
    setMode(mode);
    window.addEventListener('hashchange',()=>{
      const idx=PILLARS.findIndex(p=>`#${p.id}`===window.location.hash);
      if(idx>=0 && idx!==activeIdx) goToIndex(idx);
    });
    window.addEventListener('resize',()=>requestAnimationFrame(fitReader));
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(fitReader));
    applyRotation();
    requestAnimationFrame(tick);
  } catch(error) {
    document.getElementById('p-eyebrow').textContent = 'Config error';
    document.getElementById('p-title').textContent = 'Focus Star';
    document.getElementById('p-desc').textContent = `Could not load ${CONFIG_PATH}: ${error.message}`;
  }
}

init();
</script>
